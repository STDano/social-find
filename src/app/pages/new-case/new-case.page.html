<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>New Case</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="caseForm" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Bluesky Handle</ion-label>
      <ion-input type="text" formControlName="handle" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Name</ion-label>
      <ion-input type="text" formControlName="name" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Last Location Seen</ion-label>
      <ion-input type="text" formControlName="lastLocated" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Last Date Seen</ion-label>
      <ion-datetime presentation="date" formControlName="dateLastSeen"></ion-datetime>
    </ion-item>

    <ion-button expand="full" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Creating case...' : 'Submit' }}
    </ion-button>
  </form>
</ion-content>
